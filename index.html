<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1a14">
<title>Foosball Timer</title>
<style>
  :root {
    --bg: #0f1a14;
    --panel: #17251d;
    --panel-2: #1f3127;
    --line: #2d4437;
    --text: #eef5ef;
    --muted: #92a89a;
    --accent: #3ddc84;
    --accent-dim: #1e6b41;
    --warn: #ffb547;
    --bad: #ff5d5d;
    --call: #ffe14d;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 14px; text-align: center; font-weight: 700; }

  /* Rod sequence */
  .seq { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 14px; }
  .seq .rod { min-width: 64px; padding: 8px 10px; border-radius: 999px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-size: 14px; }
  .seq .rod.on { color: var(--text); border-color: var(--accent-dim); }
  .seq .rod.off { opacity: .35; text-decoration: line-through; }
  .seq .rod.active { background: var(--accent); color: #062312; border-color: var(--accent); }
  .seq .arrow { color: var(--muted); }

  /* Main display */
  .display { background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 16px 16px; text-align: center; }
  .display.paused { border-color: var(--warn); }
  #status { font-size: 15px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); min-height: 20px; }
  .display.paused #status { color: var(--warn); }
  #timer { font-size: 104px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  #timer.small { font-size: 44px; padding: 30px 0 30px; }
  #call { font-size: 44px; font-weight: 900; color: var(--call); min-height: 54px; text-transform: uppercase; letter-spacing: .04em; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width .1s linear; }
  .bar.late > div { background: var(--warn); }
  .bar.buffer > div { background: #5aa9ff; }
  #counts { margin-top: 12px; font-size: 16px; color: var(--muted); line-height: 1.5; }
  #counts b { color: var(--text); }
  #counts .today { font-size: 13px; }

  /* Buttons */
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button { font: inherit; border: none; border-radius: var(--radius); cursor: pointer; padding: 16px; font-weight: 700; font-size: 18px; flex: 1; }
  button:disabled { opacity: .35; cursor: default; }
  .btn-start { background: var(--accent); color: #062312; }
  .btn-start.pause { background: var(--warn); color: #2b1b00; }
  .btn-reset { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-stop { background: #3b2323; color: #ffd0d0; border: 1px solid #5a3434; }
  .btn-make { background: #1d4d33; color: #c9ffe0; font-size: 22px; padding: 22px; }
  .btn-miss { background: #4d1d1d; color: #ffd0d0; font-size: 22px; padding: 22px; }
  .btn-small { font-size: 14px; padding: 10px 12px; flex: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-link { background: transparent; color: var(--accent); font-size: 14px; padding: 6px 10px; flex: none; text-decoration: underline; }
  #micStatus { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }
  #micStatus.on::before { content: "● "; color: var(--accent); }

  /* Panels */
  details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; }
  summary { padding: 14px 16px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); }
  details[open] summary::after { content: "▴"; }
  .panel-body { padding: 0 16px 16px; }

  .rodcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .rodcard.disabled .rodbody { opacity: .4; }
  .rodhead { display: flex; justify-content: space-between; align-items: center; }
  .rodhead .t { font-weight: 800; }
  .rodhead .s { font-size: 12px; color: var(--muted); }

  .switch { position: relative; width: 50px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #3a4a40; border-radius: 99px; transition: .2s; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(22px); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
  .chip { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted);
    font-size: 15px; font-weight: 700; flex: none; }
  .chip.sel { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }

  .slider { margin-top: 10px; }
  .slider label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .slider label b { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .field { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .field label { color: var(--muted); font-size: 14px; }
  select { font: inherit; font-size: 15px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; max-width: 65%; }

  /* Stats */
  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { font-size: 14px; padding: 9px 6px; border-radius: 9px; background: transparent; color: var(--muted); }
  .seg button.sel { background: var(--accent-dim); color: var(--text); }
  .stathead { font-size: 15px; font-weight: 700; }
  .statsub { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
  .bigtotal { font-size: 15px; margin-bottom: 10px; }
  .bigtotal b { font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  h4 { margin: 8px 0 6px; font-size: 14px; color: var(--accent); }
  .sesslist { margin-top: 4px; }
  .sessrow { display: flex; justify-content: space-between; width: 100%; text-align: left; font-size: 14px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; color: var(--text); }
  .sessrow.sel { border-color: var(--accent); }
  .sessrow span { color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Foosball Timer</h1>

  <div class="seq" id="seq"></div>

  <div class="display" id="display">
    <div id="status">Ready</div>
    <div id="timer" class="small">Press Start</div>
    <div id="call"></div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <div id="counts"></div>
    <button class="btn-link" id="newSessionBtn">Start new session</button>
  </div>

  <div class="row">
    <button class="btn-start" id="startBtn">Start</button>
    <button class="btn-reset" id="resetBtn" disabled>Reset</button>
    <button class="btn-stop" id="stopBtn" disabled>Stop</button>
  </div>
  <div class="row">
    <button class="btn-make" id="makeBtn">Make</button>
    <button class="btn-miss" id="missBtn">Miss</button>
  </div>
  <div id="micStatus">Voice: “make”/“yes”, “miss”/“no”, “pause”, “resume”, “reset”, “stop”</div>
  <div id="heard" class="hint" style="text-align:center;min-height:16px"></div>

  <details id="settingsPanel">
    <summary>Drill Settings</summary>
    <div class="panel-body" id="rodSettings"></div>
    <div class="panel-body">
      <div class="field">
        <label for="bufferSelect">Buffer between reps</label>
        <select id="bufferSelect"></select>
      </div>
      <div class="field">
        <label for="voiceSelect">Voice</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="row" style="margin-top:0">
        <button class="btn-small" id="testSpeechBtn">Test speech</button>
        <button class="btn-small" id="defaultsBtn">ITSF time defaults</button>
      </div>
      <p class="hint">ITSF limits: 2-rod 15s · 5-rod 10s · 3-rod 15s. Each call lands at a random moment between “earliest call” and 1 second before the limit.</p>
    </div>
  </details>

  <details id="statsPanel">
    <summary>Statistics</summary>
    <div class="panel-body">
      <div class="seg" id="statsSeg">
        <button data-v="session">Session</button>
        <button data-v="today">Today</button>
        <button data-v="all">All time</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </details>
</div>

<script>
(() => {
  // ---------- Rod definitions ----------
  const ROD_ORDER = ['rod2', 'rod5', 'rod3'];
  const RODS = {
    rod2: {
      name: '2-Rod Pass', short: '2', kind: 'pass', statsKey: 'rod2Stats',
      sub: 'Pass from the 2-rod to the 3-rod',
      options: [
        { v: 'wall',  label: 'Wall',   say: 'wall' },
        { v: 'lane1', label: 'Lane 1', say: 'lane one' },
        { v: 'lane2', label: 'Lane 2', say: 'lane two' },
      ],
      defLimit: 15, defEarliest: 4,
    },
    rod5: {
      name: '5-Rod Pass', short: '5', kind: 'pass', statsKey: 'passStats',
      sub: 'Pass from the 5-rod to the 3-rod',
      options: [
        { v: 'wall',   label: 'Wall',   say: 'wall' },
        { v: 'lane',   label: 'Lane',   say: 'lane' },
        { v: 'middle', label: 'Middle', say: 'middle' },
        { v: 'shoot',  label: 'Shoot',  say: 'shoot' },
      ],
      defLimit: 10, defEarliest: 4,
    },
    rod3: {
      name: '3-Rod Shot', short: '3', kind: 'shot', statsKey: 'shotStats',
      sub: 'Shot lane called',
      options: ['1', '2', '3', '4', '5'].map(n => ({ v: n, label: 'Lane ' + n, say: n })),
      defLimit: 15, defEarliest: 5,
    },
  };
  const MAX_LIMIT = 30, MIN_LIMIT = 3;

  // ---------- Storage helpers ----------
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, Number(n) || lo)); }
  function randInt(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
  function todayKey() {
    const d = new Date(); // local date, so the day rolls over at your midnight
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const fmtClock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function fmtDur(secs) {
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }
  const pct = (m, n) => n ? Math.round(m / n * 100) + '%' : '–';

  // ---------- Settings ----------
  function defaultSettings() {
    const s = { enabled: { rod2: false, rod5: false, rod3: true }, options: {}, limit: {}, earliest: {}, buffer: 5, voiceName: '' };
    ROD_ORDER.forEach(r => {
      s.options[r] = RODS[r].options.map(o => o.v);
      s.limit[r] = RODS[r].defLimit;
      s.earliest[r] = RODS[r].defEarliest;
    });
    return s;
  }

  function loadSettings() {
    const s = defaultSettings();
    const saved = store.get('foosSettingsV2', null);
    if (saved) {
      ROD_ORDER.forEach(r => {
        if (saved.enabled && r in saved.enabled) s.enabled[r] = !!saved.enabled[r];
        if (saved.options && Array.isArray(saved.options[r])) {
          const valid = saved.options[r].filter(v => RODS[r].options.some(o => o.v === v));
          if (valid.length) s.options[r] = valid;
        }
        if (saved.limit && saved.limit[r]) s.limit[r] = clamp(saved.limit[r], MIN_LIMIT, MAX_LIMIT);
        if (saved.earliest && saved.earliest[r]) s.earliest[r] = saved.earliest[r];
      });
      if (saved.buffer) s.buffer = saved.buffer;
      if (saved.voiceName) s.voiceName = saved.voiceName;
    } else {
      // Migrate settings from version 1
      const oldPassMode = store.get('passMode', null);
      if (oldPassMode !== null) s.enabled.rod5 = !!oldPassMode;
      const oldPass = store.get('passOptions', null);
      if (Array.isArray(oldPass) && oldPass.length) s.options.rod5 = oldPass;
      const oldLanes = store.get('shotLanes', null);
      if (Array.isArray(oldLanes) && oldLanes.length) s.options.rod3 = oldLanes;
      const oldBuf = localStorage.getItem('bufferTime');
      if (oldBuf) s.buffer = parseInt(oldBuf, 10) || 5;
    }
    ROD_ORDER.forEach(r => { s.earliest[r] = clamp(s.earliest[r], 1, s.limit[r] - 1); });
    if (!ROD_ORDER.some(r => s.enabled[r])) s.enabled.rod3 = true;
    return s;
  }

  let settings = loadSettings();
  const saveSettings = () => store.set('foosSettingsV2', settings);

  // ---------- Stats & sessions ----------
  // Daily totals (same storage keys as version 1): { statsKey: { 'YYYY-MM-DD': { option: {makes, misses} } } }
  const stats = {};
  ROD_ORDER.forEach(r => { stats[RODS[r].statsKey] = store.get(RODS[r].statsKey, {}); });
  let practiceTime = store.get('practiceTime', {});
  const saveStats = () => {
    ROD_ORDER.forEach(r => store.set(RODS[r].statsKey, stats[RODS[r].statsKey]));
    store.set('practiceTime', practiceTime);
  };

  // Sessions: [{ id, date, num, start, end, seconds, stats: { rod: { option: {makes, misses} } } }]
  let sessions = store.get('foosSessions', []);
  let currentId = store.get('foosCurrentSession', null);
  const saveSessions = () => { store.set('foosSessions', sessions); store.set('foosCurrentSession', currentId); };
  const currentSession = () => sessions.find(s => s.id === currentId) || null;

  function totals(agg) {
    let m = 0, x = 0;
    for (const r in agg) for (const o in agg[r]) { m += agg[r][o].makes || 0; x += agg[r][o].misses || 0; }
    return { m, x, n: m + x };
  }
  const sessionHasData = s => s.seconds >= 10 || totals(s.stats).n > 0;

  function newSession() {
    flushPractice();
    const day = todayKey();
    const cur = currentSession();
    if (cur) cur.end = cur.end || Date.now();
    // Drop empty sessions so the list stays clean
    sessions = sessions.filter(s => sessionHasData(s));
    const num = sessions.filter(s => s.date === day).length + 1;
    const s = { id: Date.now().toString(36), date: day, num, start: Date.now(), end: null, seconds: 0, stats: {} };
    sessions.push(s);
    currentId = s.id;
    saveSessions();
    return s;
  }
  function ensureSession() {
    const c = currentSession();
    return (!c || c.date !== todayKey()) ? newSession() : c;
  }

  function aggDay(day) {
    const out = {};
    ROD_ORDER.forEach(r => { out[r] = stats[RODS[r].statsKey][day] || {}; });
    return out;
  }
  function aggAll() {
    const out = {};
    ROD_ORDER.forEach(r => {
      out[r] = {};
      const byDay = stats[RODS[r].statsKey];
      for (const d in byDay) for (const o in byDay[d]) {
        out[r][o] = out[r][o] || { makes: 0, misses: 0 };
        out[r][o].makes += byDay[d][o].makes || 0;
        out[r][o].misses += byDay[d][o].misses || 0;
      }
    });
    return out;
  }

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const displayEl = $('display'), statusEl = $('status'), timerEl = $('timer'), callEl = $('call');
  const barEl = $('bar'), barFill = $('barFill'), countsEl = $('counts'), seqEl = $('seq');
  const startBtn = $('startBtn'), resetBtn = $('resetBtn'), stopBtn = $('stopBtn');
  const makeBtn = $('makeBtn'), missBtn = $('missBtn');
  const bufferSelect = $('bufferSelect'), voiceSelect = $('voiceSelect');
  const micStatus = $('micStatus'), heardEl = $('heard');

  // ---------- Settings UI ----------
  function renderSettings() {
    const wrap = $('rodSettings');
    wrap.innerHTML = '';
    ROD_ORDER.forEach(r => {
      const cfg = RODS[r];
      const card = document.createElement('div');
      card.className = 'rodcard' + (settings.enabled[r] ? '' : ' disabled');
      card.innerHTML = `
        <div class="rodhead">
          <div><div class="t">${cfg.name}</div><div class="s">${cfg.sub}</div></div>
          <label class="switch"><input type="checkbox" ${settings.enabled[r] ? 'checked' : ''}><span></span></label>
        </div>
        <div class="rodbody">
          <div class="chips"></div>
          <div class="slider">
            <label>Possession time <b class="limitVal">${settings.limit[r]}s</b></label>
            <input type="range" class="limit" min="${MIN_LIMIT}" max="${MAX_LIMIT}" step="1" value="${settings.limit[r]}">
          </div>
          <div class="slider">
            <label>Earliest call <b class="earlyVal">${settings.earliest[r]}s</b></label>
            <input type="range" class="early" min="1" max="${settings.limit[r] - 1}" step="1" value="${settings.earliest[r]}">
          </div>
        </div>`;

      const toggle = card.querySelector('.switch input');
      toggle.addEventListener('change', () => {
        if (!toggle.checked && ROD_ORDER.filter(x => settings.enabled[x]).length === 1) {
          toggle.checked = true; // keep at least one rod in the drill
          flash('At least one rod must stay on');
          return;
        }
        settings.enabled[r] = toggle.checked;
        card.classList.toggle('disabled', !toggle.checked);
        saveSettings(); renderSeq(); renderStats();
      });

      const chips = card.querySelector('.chips');
      cfg.options.forEach(o => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (settings.options[r].includes(o.v) ? ' sel' : '');
        b.textContent = o.label;
        b.addEventListener('click', () => {
          const sel = settings.options[r];
          if (sel.includes(o.v)) {
            if (sel.length === 1) { flash('Keep at least one option'); return; }
            settings.options[r] = sel.filter(v => v !== o.v);
          } else {
            settings.options[r] = cfg.options.map(x => x.v).filter(v => v === o.v || sel.includes(v));
          }
          b.classList.toggle('sel');
          saveSettings();
        });
        chips.appendChild(b);
      });

      const limit = card.querySelector('.limit'), early = card.querySelector('.early');
      const limitVal = card.querySelector('.limitVal'), earlyVal = card.querySelector('.earlyVal');
      limit.addEventListener('input', () => {
        settings.limit[r] = parseInt(limit.value, 10);
        limitVal.textContent = settings.limit[r] + 's';
        early.max = settings.limit[r] - 1;
        if (settings.earliest[r] > settings.limit[r] - 1) {
          settings.earliest[r] = settings.limit[r] - 1;
          early.value = settings.earliest[r];
          earlyVal.textContent = settings.earliest[r] + 's';
        }
        saveSettings();
      });
      early.addEventListener('input', () => {
        settings.earliest[r] = parseInt(early.value, 10);
        earlyVal.textContent = settings.earliest[r] + 's';
        saveSettings();
      });

      wrap.appendChild(card);
    });
  }

  function renderSeq(activeRod) {
    seqEl.innerHTML = '';
    ROD_ORDER.forEach((r, i) => {
      if (i > 0) { const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '→'; seqEl.appendChild(a); }
      const d = document.createElement('div');
      d.className = 'rod ' + (settings.enabled[r] ? 'on' : 'off') + (activeRod === r ? ' active' : '');
      d.textContent = RODS[r].short + '-Rod';
      seqEl.appendChild(d);
    });
  }

  for (let i = 1; i <= 10; i++) {
    const o = document.createElement('option'); o.value = i; o.textContent = i + ' seconds'; bufferSelect.appendChild(o);
  }
  bufferSelect.value = settings.buffer;
  bufferSelect.addEventListener('change', () => { settings.buffer = parseInt(bufferSelect.value, 10); saveSettings(); });

  $('defaultsBtn').addEventListener('click', () => {
    ROD_ORDER.forEach(r => { settings.limit[r] = RODS[r].defLimit; settings.earliest[r] = RODS[r].defEarliest; });
    saveSettings(); renderSettings();
  });

  let flashTimer = null;
  function flash(msg) {
    if (!('base' in micStatus.dataset)) micStatus.dataset.base = micStatus.textContent;
    micStatus.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { micStatus.textContent = micStatus.dataset.base; delete micStatus.dataset.base; }, 1800);
  }
  function setMicText(text, on) {
    micStatus.classList.toggle('on', !!on);
    if ('base' in micStatus.dataset) micStatus.dataset.base = text; else micStatus.textContent = text;
  }

  // ---------- Speech synthesis ----------
  let voices = [];
  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    voiceSelect.innerHTML = '';
    if (!voices.length) {
      const o = document.createElement('option'); o.textContent = 'Default voice'; o.value = ''; voiceSelect.appendChild(o);
      return;
    }
    voices.forEach(v => {
      const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; voiceSelect.appendChild(o);
    });
    const pick = voices.find(v => v.name === settings.voiceName)
      || voices.find(v => v.name === 'Samantha' && v.lang === 'en-US')
      || voices.find(v => v.lang === 'en-US')
      || voices[0];
    voiceSelect.value = pick.name;
  }
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }
  voiceSelect.addEventListener('change', () => { settings.voiceName = voiceSelect.value; saveSettings(); });

  // The mic keeps listening while the timer talks: none of the spoken calls are command words.
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1; u.pitch = 1; u.volume = 1;
    const v = voices.find(x => x.name === voiceSelect.value);
    if (v) u.voice = v;
    try { speechSynthesis.speak(u); } catch (e) {}
  }
  const hush = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); };
  $('testSpeechBtn').addEventListener('click', () => speak('lane two'));

  // ---------- Speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null, micWanted = false, micBlocked = false, micLive = false, micStarting = false;

  // Exact words count anywhere in the phrase; sound-alikes for make/miss only count when the phrase is 1–2 words.
  const CMD = {
    stop:   { exact: ['stop', 'quit', 'end'] },
    reset:  { exact: ['reset', 'restart', 'again'] },
    pause:  { exact: ['pause', 'paws', 'hold', 'wait'] },
    resume: { exact: ['resume', 'continue', 'unpause'] },
    start:  { exact: ['start', 'go'] },
    make:   { exact: ['make', 'made', 'makes', 'making', 'yes', 'yeah', 'yep', 'good', 'goal', 'score', 'scored'],
              alike: ['mate', 'may', 'maid', 'mike', 'bake', 'take', 'cake', 'fake', 'lake', 'wake', 'mick', 'meg', 'mayk', 'mk'] },
    miss:   { exact: ['miss', 'missed', 'misses', 'missing', 'no', 'nope', 'nah', 'bad'],
              alike: ['mess', 'ms', 'mrs', 'mis', 'myth', 'kiss', 'this', 'bliss', 'piss', 'mist', 'mitch', 'nest', 'mix'] },
  };
  const CMD_ORDER = ['stop', 'reset', 'pause', 'resume', 'start', 'make', 'miss'];

  function matchCommand(phrase) {
    const words = phrase.toLowerCase().replace(/[^a-z\s']/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    for (const cmd of CMD_ORDER) {
      if (words.some(w => CMD[cmd].exact.includes(w))) return cmd;
    }
    if (words.length <= 2) {
      for (const cmd of ['make', 'miss']) {
        if (words.some(w => CMD[cmd].alike.includes(w))) return cmd;
      }
    }
    return null;
  }

  function handleVoice(cmd) {
    switch (cmd) {
      case 'stop':   if (state !== 'idle') stopDrill(); break;
      case 'reset':  if (state !== 'idle') resetRep(); break;
      case 'pause':  if (state === 'running') pauseDrill(); break;
      case 'resume': if (state === 'paused') resumeDrill(); break;
      case 'start':  if (state === 'idle') startDrill(); else if (state === 'paused') resumeDrill(); break;
      default:       recordResult(cmd);
    }
  }

  // Each recognised phrase is acted on once, as soon as an interim guess matches
  const handledResults = new Set();
  let recogSession = 0;

  if (SR) {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 5;
    recognition.lang = 'en-US';

    recognition.onstart = () => { micLive = true; micStarting = false; };
    recognition.onresult = (event) => {
      if (!micWanted) return;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const key = recogSession + ':' + i;
        if (handledResults.has(key)) continue;
        const res = event.results[i];
        let cmd = null, heardText = res[0].transcript.trim();
        for (let a = 0; a < res.length && !cmd; a++) {
          cmd = matchCommand(res[a].transcript);
          if (cmd) heardText = res[a].transcript.trim();
        }
        heardEl.textContent = `Heard: “${heardText}”${cmd ? ' → ' + cmd : ''}`;
        if (!cmd) continue;
        handledResults.add(key);
        handleVoice(cmd);
      }
    };
    recognition.onend = () => {
      micLive = false; micStarting = false;
      recogSession++; handledResults.clear();
      if (micWanted && !micBlocked) restartMic();
    };
    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micBlocked = true;
        setMicText('Microphone blocked — allow mic access, or use the Make / Miss buttons', false);
      }
    };
    // Watchdog: browsers end recognition after silence or ~60s; make sure it always comes back
    setInterval(() => { if (micWanted && !micBlocked && !micLive && !micStarting) restartMic(); }, 1500);
  } else {
    micStatus.textContent = 'Voice commands not supported in this browser (use Chrome) — use the buttons';
  }

  function restartMic() {
    if (micStarting || micLive) return;
    micStarting = true;
    try { recognition.start(); } catch (e) { micStarting = false; }
  }
  function startListening() {
    if (!recognition || micBlocked) return;
    micWanted = true;
    restartMic();
    setMicText('Listening: “make”/“yes”, “miss”/“no”, “pause”, “reset”, “stop”', true);
  }
  function stopListening() {
    if (!recognition) return;
    micWanted = false;
    try { recognition.abort(); } catch (e) {}
    heardEl.textContent = '';
    if (!micBlocked) setMicText('Microphone off — press Start to turn it back on', false);
  }

  // ---------- Wake lock ----------
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // ---------- Practice time (counts only while running, not paused or stopped) ----------
  let practiceStart = null, practiceInterval = null;
  function flushPractice() {
    if (!practiceStart) return;
    const secs = Math.floor((Date.now() - practiceStart) / 1000);
    if (secs <= 0) return;
    const k = todayKey();
    practiceTime[k] = (practiceTime[k] || 0) + secs;
    const s = currentSession();
    if (s) { s.seconds += secs; s.end = Date.now(); }
    practiceStart += secs * 1000;
    saveStats(); saveSessions();
  }
  function startPractice() {
    if (!practiceStart) practiceStart = Date.now();
    if (!practiceInterval) practiceInterval = setInterval(() => { flushPractice(); renderStats(); }, 5000);
  }
  function stopPractice() {
    flushPractice();
    practiceStart = null;
    clearInterval(practiceInterval); practiceInterval = null;
    renderStats();
  }

  // ---------- Pausable scheduler ----------
  let state = 'idle'; // 'idle' | 'running' | 'paused'
  let jobs = [];      // pending timeouts: { fn, due, id, remaining }
  let cd = null;      // countdown: { end, total, mode, remaining }
  let tickId = null;

  function schedule(job, ms) {
    job.due = Date.now() + ms;
    job.id = setTimeout(() => { jobs = jobs.filter(j => j !== job); job.fn(); }, ms);
  }
  function later(fn, ms) { const job = { fn }; schedule(job, ms); jobs.push(job); }
  function clearTimers() {
    jobs.forEach(j => clearTimeout(j.id)); jobs = [];
    clearInterval(tickId); tickId = null; cd = null;
  }
  function freezeTimers() {
    const now = Date.now();
    jobs.forEach(j => { clearTimeout(j.id); j.remaining = Math.max(0, j.due - now); });
    clearInterval(tickId); tickId = null;
    if (cd) cd.remaining = Math.max(0, cd.end - now);
  }
  function thawTimers() {
    jobs.forEach(j => schedule(j, j.remaining));
    if (cd) { cd.end = Date.now() + cd.remaining; tick(); tickId = setInterval(tick, 100); }
  }

  function runCountdown(totalSec, mode) {
    clearInterval(tickId);
    cd = { end: Date.now() + totalSec * 1000, total: totalSec * 1000, mode };
    barEl.className = 'bar' + (mode === 'buffer' ? ' buffer' : '');
    timerEl.classList.remove('small');
    tick();
    tickId = setInterval(tick, 100);
  }
  function tick() {
    if (!cd) return;
    const left = Math.max(0, cd.end - Date.now());
    timerEl.textContent = Math.ceil(left / 1000);
    barFill.style.width = (left / cd.total * 100) + '%';
    if (cd.mode !== 'buffer') barEl.classList.toggle('late', left < 3000);
    if (left <= 0) { clearInterval(tickId); tickId = null; }
  }

  // ---------- Drill engine ----------
  let sequence = [];
  let lastCall = null; // { rod, opt, recorded }

  function updateButtons() {
    startBtn.textContent = state === 'idle' ? 'Start' : state === 'running' ? 'Pause' : 'Resume';
    startBtn.classList.toggle('pause', state === 'running');
    resetBtn.disabled = state === 'idle';
    stopBtn.disabled = state === 'idle';
    displayEl.classList.toggle('paused', state === 'paused');
  }

  function startDrill() {
    if (state !== 'idle') return;
    state = 'running';
    ensureSession();
    $('settingsPanel').open = false;
    startListening();
    startPractice();
    updateButtons();
    renderCounts();
    startCycle();          // speaks inside the tap, so iOS allows audio
    requestWakeLock();
  }

  function pauseDrill() {
    if (state !== 'running') return;
    state = 'paused';
    freezeTimers();
    hush();
    stopPractice();
    statusEl.dataset.prev = statusEl.textContent;
    statusEl.textContent = 'Paused';
    updateButtons();
  }

  function resumeDrill() {
    if (state !== 'paused') return;
    state = 'running';
    statusEl.textContent = statusEl.dataset.prev || '';
    startPractice();
    requestWakeLock();
    updateButtons();
    thawTimers();
  }

  // Reset: abandon the current rep and start a fresh one straight away
  function resetRep() {
    if (state === 'idle') { startDrill(); return; }
    clearTimers();
    hush();
    state = 'running';
    callEl.textContent = '';
    startPractice();
    updateButtons();
    startCycle();
  }

  // Stop: end the drill and turn the microphone off
  function stopDrill() {
    clearTimers();
    state = 'idle';
    hush();
    releaseWakeLock();
    stopPractice();
    stopListening();
    lastCall = null;
    statusEl.textContent = 'Stopped';
    timerEl.textContent = 'Press Start';
    timerEl.classList.add('small');
    callEl.textContent = '';
    barFill.style.width = '0%';
    renderSeq();
    updateButtons();
  }

  function startCycle() {
    if (state !== 'running') return;
    clearTimers();
    sequence = ROD_ORDER.filter(r => settings.enabled[r]);
    lastCall = null;
    runPhase(0);
  }

  function runPhase(i) {
    if (state !== 'running') return;
    if (i >= sequence.length) { startBuffer(); return; }
    const rod = sequence[i], cfg = RODS[rod];
    const limit = settings.limit[rod];
    const earliest = clamp(settings.earliest[rod], 1, limit - 1);
    const callSec = randInt(earliest, Math.max(earliest, limit - 1));

    renderSeq(rod);
    statusEl.textContent = `${cfg.name} · Set`;
    callEl.textContent = '';
    speak('set');
    runCountdown(limit, 'possession');

    later(() => {
      const opts = settings.options[rod];
      const optV = opts[Math.floor(Math.random() * opts.length)];
      const opt = cfg.options.find(o => o.v === optV);
      lastCall = { rod, opt: optV, recorded: false };
      statusEl.textContent = cfg.name;
      callEl.textContent = cfg.kind === 'shot' ? `Shoot ${opt.v}` : opt.label;
      speak(opt.say);

      const skipToBuffer = rod === 'rod5' && optV === 'shoot';
      later(() => { skipToBuffer ? startBuffer() : runPhase(i + 1); }, 1000);
    }, callSec * 1000);
  }

  function startBuffer() {
    if (state !== 'running') return;
    clearTimers();
    renderSeq();
    statusEl.textContent = 'Reset the ball';
    runCountdown(settings.buffer, 'buffer');
    later(startCycle, settings.buffer * 1000);
  }

  function recordResult(type) {
    if (!lastCall || lastCall.recorded) {
      // Nothing left to score, but "miss" still means: start the rep over
      if (type === 'miss' && state !== 'idle') { flash('Miss — restarting rep'); resetRep(); }
      else flash('No call to score yet');
      return;
    }
    const { rod, opt } = lastCall;
    const field = type === 'make' ? 'makes' : 'misses';

    const key = RODS[rod].statsKey, day = todayKey();
    stats[key][day] = stats[key][day] || {};
    stats[key][day][opt] = stats[key][day][opt] || { makes: 0, misses: 0 };
    stats[key][day][opt][field]++;

    const s = ensureSession();
    s.stats[rod] = s.stats[rod] || {};
    s.stats[rod][opt] = s.stats[rod][opt] || { makes: 0, misses: 0 };
    s.stats[rod][opt][field]++;
    s.end = Date.now();

    lastCall.recorded = true;
    saveStats(); saveSessions();
    renderCounts(); renderStats();
    flash(`${type === 'make' ? 'Make' : 'Miss'} logged: ${RODS[rod].name} – ${RODS[rod].options.find(o => o.v === opt).label}`);

    // Any miss (pass or shot) resets the rep and starts the next one straight away, same as Reset
    if (type === 'miss' && state !== 'idle') resetRep();
  }

  startBtn.addEventListener('click', () => {
    if (state === 'idle') startDrill();
    else if (state === 'running') pauseDrill();
    else resumeDrill();
  });
  resetBtn.addEventListener('click', resetRep);
  stopBtn.addEventListener('click', stopDrill);
  makeBtn.addEventListener('click', () => recordResult('make'));
  missBtn.addEventListener('click', () => recordResult('miss'));
  $('newSessionBtn').addEventListener('click', () => {
    const s = newSession();
    statsView = { type: 'session', id: s.id };
    renderCounts(); renderStats();
    flash(`Session ${s.num} started — today's totals keep adding up`);
  });

  document.addEventListener('visibilitychange', () => {
    if (state !== 'running') return;
    if (document.hidden) { flushPractice(); practiceStart = null; }
    else { practiceStart = Date.now(); requestWakeLock(); if ('speechSynthesis' in window) speechSynthesis.resume(); }
  });
  window.addEventListener('pagehide', () => { if (state === 'running') flushPractice(); });

  // ---------- Stats display ----------
  let statsView = { type: 'session', id: null }; // id null = current session

  function renderCounts() {
    const s = currentSession();
    const live = s && s.date === todayKey();
    const st = live ? totals(s.stats) : { m: 0, x: 0, n: 0 };
    const td = totals(aggDay(todayKey()));
    countsEl.innerHTML =
      `${live ? 'Session ' + s.num : 'New session'} — Made <b>${st.m}</b> · Miss <b>${st.x}</b>` +
      `<div class="today">Today — ${td.m} made · ${td.x} missed · ${pct(td.m, td.n)}</div>`;
  }

  function statTables(agg) {
    let html = '';
    ROD_ORDER.forEach(r => {
      const cfg = RODS[r], data = agg[r] || {};
      const hasData = Object.values(data).some(s => (s.makes || 0) + (s.misses || 0) > 0);
      if (!hasData && !settings.enabled[r]) return;
      const rows = cfg.options.map(o => {
        const s = data[o.v] || { makes: 0, misses: 0 };
        return `<tr><td>${o.label}</td><td>${s.makes}</td><td>${s.misses}</td><td>${pct(s.makes, s.makes + s.misses)}</td></tr>`;
      }).join('');
      html += `<h4>${cfg.name}</h4><table><tr><th>Call</th><th>Make</th><th>Miss</th><th>%</th></tr>${rows}</table>`;
    });
    return html;
  }

  function sessionList(day, selectedId) {
    const list = sessions.filter(s => s.date === day && (sessionHasData(s) || s.id === currentId));
    if (!list.length) return '';
    return `<h4>Today's sessions</h4><div class="sesslist">` + list.map(s => {
      const t = totals(s.stats);
      const span = `${fmtClock(s.start)}${s.end ? '–' + fmtClock(s.end) : ''}`;
      return `<button class="sessrow${s.id === selectedId ? ' sel' : ''}" data-id="${s.id}">
        Session ${s.num}${s.id === currentId ? ' (current)' : ''}
        <span>${span} · ${fmtDur(s.seconds)} · ${t.m}/${t.n} ${pct(t.m, t.n)}</span></button>`;
    }).join('') + `</div>`;
  }

  function renderStats() {
    const day = todayKey();
    const body = $('statsBody');
    let html = '';

    if (statsView.type === 'session') {
      const s = sessions.find(x => x.id === (statsView.id || currentId));
      if (!s) {
        html = `<p class="muted">No session yet — press Start.</p>`;
      } else {
        const t = totals(s.stats);
        const dayLabel = s.date === day ? '' : ` · ${s.date}`;
        html += `<div class="stathead">Session ${s.num}${s.id === currentId ? ' (current)' : ''}</div>
          <div class="statsub">${fmtClock(s.start)}${s.end ? '–' + fmtClock(s.end) : ''}${dayLabel} · practice ${fmtDur(s.seconds)}</div>
          <div class="bigtotal"><b>${t.m}</b> made · <b>${t.x}</b> missed · ${pct(t.m, t.n)}</div>`;
        html += statTables(s.stats);
        html += sessionList(day, s.id);
      }
    } else if (statsView.type === 'today') {
      const agg = aggDay(day), t = totals(agg);
      const n = sessions.filter(s => s.date === day && sessionHasData(s)).length;
      html += `<div class="stathead">Today</div>
        <div class="statsub">${n} session${n === 1 ? '' : 's'} · practice ${fmtDur(practiceTime[day] || 0)}</div>
        <div class="bigtotal"><b>${t.m}</b> made · <b>${t.x}</b> missed · ${pct(t.m, t.n)}</div>`;
      html += statTables(agg);
      html += sessionList(day, null);
    } else {
      const agg = aggAll(), t = totals(agg);
      const allSecs = Object.values(practiceTime).reduce((a, b) => a + b, 0);
      const days = Object.keys(practiceTime).filter(d => practiceTime[d] > 0).length;
      html += `<div class="stathead">All time</div>
        <div class="statsub">${days} day${days === 1 ? '' : 's'} practised · ${fmtDur(allSecs)}</div>
        <div class="bigtotal"><b>${t.m}</b> made · <b>${t.x}</b> missed · ${pct(t.m, t.n)}</div>`;
      html += statTables(agg);
    }

    body.innerHTML = html;
    body.querySelectorAll('.sessrow').forEach(b => b.addEventListener('click', () => {
      statsView = { type: 'session', id: b.dataset.id === currentId ? null : b.dataset.id };
      renderStats();
    }));
    $('statsSeg').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v === statsView.type));
  }

  $('statsSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    statsView = { type: b.dataset.v, id: null };
    renderStats();
  }));

  // ---------- Init ----------
  renderSettings();
  renderSeq();
  updateButtons();
  renderCounts();
  renderStats();
})();
</script>
</body>
</html>
